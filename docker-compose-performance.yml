# Stack de test de performance ISOLÉE pour le front Elearning (Elearning_Web_Service).
#
#   ./performance_test.sh          (local, NODE_AUTH_TOKEN exporté pour le build)
#   docker compose -f docker-compose-performance.yml up --build \
#       --abort-on-container-exit --exit-code-from k6-perf-test   (CI)
#
# k6-perf-test sort en échec si un seuil de load-test.js est dépassé.
# TARGET_IMAGE (optionnel) : image front pré-construite à tester au lieu du build local.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.2.0}
    container_name: elearning-front-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.2.0}
    container_name: elearning-front-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: elearning-front-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: elearning-front-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.1.0}
    container_name: elearning-front-perf-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-perf-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  elearning-api:
    image: ${ELEARNING_API_IMAGE:-ghcr.io/mairie360/elearning-api:1.1.0}
    container_name: elearning-front-perf-elearning-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3006
      PUBLIC_URL: http://elearning-api:3006
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
      # E-learning API also throttles each client IP with a token bucket (api_lib governor, 20 req/s by default):
      # lifted like in BFF_Elearning's own stacks, otherwise the k6 load test turns into 429s relayed as 502.
      RATE_LIMIT_PER_SECOND: "100000"
      RATE_LIMIT_BURST: "100000"
      S3_BUCKET: mairie360-elearning
      S3_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PRESIGN_TTL_SECS: 900
    expose:
      - "3006"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur elearning-api-ready ci-dessous.

  elearning-api-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-perf-elearning-api-ready
    depends_on:
      elearning-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://elearning-api:3006/health >/dev/null; do
      echo "waiting for elearning-api..."; sleep 2; done; echo "elearning-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:1.0.0}
    container_name: elearning-front-perf-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
      # The scanners replay the auth routes from one IP with invalid credentials on purpose: the
      # auth rate limits of BFF User (MAIR-226) would answer 429 and hide the real responses.
      AUTH_RATE_LIMIT_ENABLED: "false"
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-perf-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  bff-elearning:
    image: ${BFF_ELEARNING_IMAGE:-ghcr.io/mairie360/bff-elearning:staging-55dfd4b}
    container_name: elearning-front-perf-bff-elearning
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      elearning-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4006
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      ELEARNING_API_URL: elearning-api
      # Same secret as the APIs: BFF_Elearning verifies the session tokens with it and refuses to start without it.
      JWT_SECRET: 'b"secret"'
      ELEARNING_API_PORT: 3006
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4006"
    networks:
      - backend

  bff-elearning-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-perf-bff-elearning-ready
    depends_on:
      bff-elearning:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-elearning:4006/health >/dev/null; do
      echo "waiting for bff-elearning..."; sleep 2; done; echo "bff-elearning ready"'
    networks:
      - backend

  elearning-front:
    image: ${TARGET_IMAGE:-elearning-front:perf}
    container_name: elearning-front-perf-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-elearning-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5006
      # Readiness resumes on this isolated frontend origin without following Login.
      LOGIN_FRONT_URL: "${LOGIN_FRONT_URL:-http://login-front.invalid/}"
      ELEARNING_FRONT_URL: http://elearning-front:5006/
      BFF_ELEARNING_BASE_URL: http://bff-elearning:4006
    expose:
      - "5006"
    networks:
      - backend
    # curl est installé dans l'image runner. Sans cookie, le middleware répond 307
    # (reprise locale) : curl -f l'accepte, seul un statut >= 400 échoue.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5006/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: elearning-front-perf-k6
    depends_on:
      elearning-front:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
    environment:
      BASE_URL: http://elearning-front:5006
      JWT_SECRET: 'b"secret"'
      PERF_USER_ID: "2"
    command: ["run", "/load-test.js"]
    networks:
      - backend
