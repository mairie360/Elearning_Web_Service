volumes:
  postgres-data:
  redis-data:

networks:
  backend:
  frontend:

x-common-env: &common-env
  HOSTNAME: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  CORE_PUBLIC_URL: http://development.mairie360.fr

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

# x-depends-on: &depends-on
#   postgres:
#     condition: service_healthy
#   redis:
#     condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
    - frontend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    profiles: ["legacy-stack"]
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    restart: always
    container_name: mairie360-db-elearning-front #change front name
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    profiles: ["legacy-stack"]
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: mairie360-liquibase-elearning-front #change front name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  redis:
    profiles: ["legacy-stack"]
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-elearning-front #change front name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    profiles: ["legacy-stack"]
    container_name: core-api-elearning-front-developpement
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    ports:
      - "3000:3000"
    networks:
      - backend
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  elearning-api:
    profiles: ["legacy-stack"]
    container_name: elearning-api-front-elearning-developpement
    image: ${ELEARNING_API_IMAGE:-ghcr.io/mairie360/elearning-api:0.6.1}
    ports:
      - "3006:3006"
    networks:
      - backend
    environment:
      <<: *api-env
      PORT: 3006
      PUBLIC_URL: http://elearning-api:3006
      S3_BUCKET: mairie360-elearning
      S3_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PRESIGN_TTL_SECS: 900
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  #add other apis if needed

  bff-user:
    profiles: ["legacy-stack"]
    container_name: bff-user-elearning-front-developpement
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.5.0}
    ports:
      - "4000:4000"
    networks:
      - backend
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: b"secret"
      CORE_API_URL: http://core-api:3000
    depends_on:
      core-api:
        condition: service_started

  bff-elearning:
    profiles: ["legacy-stack"]
    container_name: bff-elearning-elearning-front
    image: ${BFF_ELEARNING_IMAGE:-ghcr.io/mairie360/bff-elearning:0.4.0}
    ports:
      - "4006:4006"
    networks:
      - backend
      - frontend
    environment:
      CORE_API_URL: "core-api"
      CORE_API_PORT: 3000
      ELEARNING_API_URL: "elearning-api"
      ELEARNING_API_PORT: 3006
      USER_BFF_URL: http://bff-user:4000
      PORT: 4006
    depends_on:
      elearning-api:
        condition: service_started
      bff-user:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  elearning-front: # Ton application React
    container_name: elearning-front-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - NODE_AUTH_TOKEN
    ports:
      - "5006:3000" # On map le 3000 interne sur 5006 pour éviter le conflit avec 'core'
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    secrets:
      - NODE_AUTH_TOKEN
    environment:
      <<: *common-env
      PORT: 3000
      BFF_ELEARNING_BASE_URL: ${BFF_ELEARNING_BASE_URL:-http://host.docker.internal:4006}
      # Force React/Vite à surveiller les fichiers correctement dans Docker
      WATCHPACK_POLLING: "true" 
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      retries: 3
        
secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN
