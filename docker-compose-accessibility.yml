# Accessibility (RGAA) test stack of the elearning front (MAIR-316 / MAIR-317).
#
#   ./accessibility_test.sh        (local: builds the front when IMAGE_REF is empty)
#
# Same stack as docker-compose-security.yml (database + seed, core-api, elearning-api, bff-user,
# bff-elearning), plus init-accessibility.sql (the users of rgaa.yaml, seeder-a11y), the front on
# ${IMAGE_REF} (staging-<sha> in the CI, release-prod job) with every variable it reads and,
# instead of ZAP, the runner of the RGAA engine of mairie360/CICD (cicd-repo/tests/a11y), which
# plays the states of rgaa.yaml and writes rgaa-report/. Each state is played logged in as one of
# the users of rgaa.yaml, with an accessToken the engine signs with the JWT_SECRET below. Exit
# codes: 0 ok, 1 state unreachable / undeclared criterion, 2 invalid rgaa.yaml, 3 rate below
# RGAA_MIN_RATE.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: elearning-front-a11y-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: elearning-front-a11y-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: elearning-front-a11y-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  # Accessibility-only data (users of rgaa.yaml), after the shared seed of the ZAP / k6 stacks.
  seeder-a11y:
    image: postgres:18-alpine
    container_name: elearning-front-a11y-seeder-a11y
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./init-accessibility.sql:/init-accessibility.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-accessibility.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: elearning-front-a11y-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: elearning-front-a11y-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-a11y-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  elearning-api:
    image: ${ELEARNING_API_IMAGE:-ghcr.io/mairie360/elearning-api:0.6.1}
    container_name: elearning-front-a11y-elearning-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3006
      PUBLIC_URL: http://elearning-api:3006
      S3_BUCKET: mairie360-elearning
      S3_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PRESIGN_TTL_SECS: 900
    expose:
      - "3006"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur elearning-api-ready ci-dessous.

  elearning-api-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-a11y-elearning-api-ready
    depends_on:
      elearning-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://elearning-api:3006/health >/dev/null; do
      echo "waiting for elearning-api..."; sleep 2; done; echo "elearning-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.5.0}
    container_name: elearning-front-a11y-bff-user
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-a11y-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  bff-elearning:
    image: ${BFF_ELEARNING_IMAGE:-ghcr.io/mairie360/bff-elearning:0.4.0}
    container_name: elearning-front-a11y-bff-elearning
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      elearning-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4006
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      ELEARNING_API_URL: elearning-api
      ELEARNING_API_PORT: 3006
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4006"
    networks:
      - backend

  bff-elearning-ready:
    image: curlimages/curl:latest
    container_name: elearning-front-a11y-bff-elearning-ready
    depends_on:
      bff-elearning:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-elearning:4006/health >/dev/null; do
      echo "waiting for bff-elearning..."; sleep 2; done; echo "bff-elearning ready"'
    networks:
      - backend

  elearning-front:
    # Published image (staging-<sha> in the CI); accessibility_test.sh builds one locally.
    image: ${IMAGE_REF:?IMAGE_REF must name the front image to test}
    container_name: elearning-front-a11y-front
    depends_on:
      bff-elearning-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5006
      BFF_ELEARNING_BASE_URL: http://bff-elearning:4006
      # Every variable the front reads (src/lib/front-urls.ts, src/middleware.ts): a missing one
      # changes the page (no link in the shell, or an error page instead of a redirect). The other
      # fronts are not part of the stack, their links only need a valid URL.
      # The unauthenticated health probe expects a redirect, not a missing-login 503.
      LOGIN_FRONT_URL: http://login-front.invalid/
      DASHBOARD_FRONT_URL: http://dashboard-front.invalid/
      PROJECT_FRONT_URL: http://projects-front.invalid/
      CALENDAR_FRONT_URL: http://calendar-front.invalid/
      MESSAGE_FRONT_URL: http://messages-front.invalid/
      ELEARNING_FRONT_URL: http://elearning-front:5006/
      SETTINGS_FRONT_URL: http://settings-front.invalid/
      ADMINISTRATION_FRONT_URL: http://administration-front.invalid/
      EMAIL_FRONT_URL: http://email-front.invalid/
      FILES_FRONT_URL: http://files-front.invalid/
      COOKIE_DOMAIN: elearning-front
    expose:
      - "5006"
    networks:
      - backend
    # curl est installé dans l'image runner. Sans cookie, le middleware répond 307
    # (redirection Login) : curl -f l'accepte, seul un statut >= 400 échoue.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5006/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  a11y:
    image: ${A11Y_RUNNER_IMAGE:?A11Y_RUNNER_IMAGE comes from cicd-repo/tests/a11y/runner-image}
    # Run as the caller (accessibility_test.sh exports them), so that rgaa-report/ and
    # .rgaa-ai-cache/ are not root-owned in the checkout.
    user: "${RGAA_UID:-0}:${RGAA_GID:-0}"
    container_name: elearning-front-a11y-runner
    depends_on:
      elearning-front:
        condition: service_healthy
    command: ["sh", "/engine/run.sh"]
    environment:
      RGAA_MIN_RATE: ${RGAA_MIN_RATE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RGAA_AI_MODEL: ${RGAA_AI_MODEL:-}
    volumes:
      - ./cicd-repo/tests/a11y:/engine:ro
      - ./rgaa.yaml:/scope/rgaa.yaml:ro
      - ./rgaa-report:/report
      - ./.rgaa-ai-cache:/ai-cache
    networks:
      - backend
